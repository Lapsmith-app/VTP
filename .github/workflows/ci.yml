name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The schema is the source of truth. If any generated artefact has
      # drifted from it, the spec tables, the vectors and the reference header
      # can disagree — which is the failure this repository exists to prevent.
      - name: Generated artefacts are up to date
        run: python3 tools/generate.py --check

      # The drift check above covers GENERATED artefacts. This covers the
      # hand-written prose that describes them: section cross-references that
      # resolve, and stated corpus counts that match the corpus. Both drift
      # silently and neither is visible to the conformance suite.
      - name: Documentation claims match the artefacts
        run: python3 tools/check_docs.py

      # Asks from the SCHEMA what a vector would have to look like to exercise
      # each rule, and fails if the corpus has none. Complements the mutation
      # sweep below rather than duplicating it: this catches rules no vector
      # exercises, that one catches code no rule reaches.
      - name: Corpus can detect a violation of every rule
        run: python3 tools/check_corpus.py

      # Builds both adapters: the decoder harness (vtp1_cli) and the producer
      # harness (vtp1_producer).
      - name: Build C reference
        run: make -C reference/c

      - name: Conformance — C reference
        run: python3 conformance/run.py --impl "reference/c/vtp1_cli"

      - name: Conformance — Python reference
        run: python3 conformance/run.py --impl "python3 reference/python/vtp1.py"

      # A suite that cannot fail proves nothing. Break the decoder on purpose
      # and require the corpus to notice.
      - name: Conformance suite detects a seeded fault
        run: |
          cp reference/c/vtp1.c /tmp/vtp1.c.orig
          sed -i 's|(uint64_t)o->dt \* 10u|(uint64_t)o->dt * 1u|' reference/c/vtp1.c
          make -C reference/c
          if python3 conformance/run.py --impl "reference/c/vtp1_cli"; then
            echo "::error::Seeded CAN timestamp fault was not detected by the corpus"
            exit 1
          fi
          cp /tmp/vtp1.c.orig reference/c/vtp1.c
          make -C reference/c
          echo "Seeded decoder fault correctly detected."

      # The encoder's gating rule (SPEC.md 5.1) is covered by exactly one
      # non-canonical vector. Removing that vector, or the gate, must fail.
      - name: Conformance suite detects a seeded encoder fault
        run: |
          cp reference/c/vtp1_encode.c /tmp/vtp1_encode.c.orig
          perl -pi -e 's/gate32\(\(uint32_t\)f->alt_msl, v, VTP_GPS_VALIDITY_ALT_MSL\)/(uint32_t)f->alt_msl/' reference/c/vtp1_encode.c
          make -C reference/c
          if python3 conformance/run.py --impl "reference/c/vtp1_cli"; then
            echo "::error::Seeded encoder gating fault was not detected by the corpus"
            exit 1
          fi
          cp /tmp/vtp1_encode.c.orig reference/c/vtp1_encode.c
          make -C reference/c
          echo "Seeded encoder fault correctly detected."

      # The synthetic device decoded by the reference decoder. Needs no
      # Bluetooth adapter, because everything worth testing in a peripheral is
      # in the device model rather than the transport -- and it asserts what no
      # single-payload vector can: one shared clock across three roles,
      # timestamps that advance across batches, and a control plane that
      # changes behaviour rather than merely answering.
      - name: Software peripheral conforms
        run: python3 reference/peripheral/selftest.py

      # The two steps above are handcrafted regression guards for specific
      # bugs. This sweeps whole CLASSES of fault -- every encoder validity
      # gate, every decoder field offset, every exact-length check -- and
      # fails on any mutation the corpus does not notice. A survivor is a hole
      # in the corpus, not a bug in the decoder. It found eight on its first
      # run, none of which review had caught.
      - name: Conformance suite has no coverage holes
        run: python3 tools/mutate.py

      # ...and the sweep itself must be capable of failing. Breaking a header
      # made all 79 mutations fail to compile while tools/mutate.py reported
      # success and exited 0, so this step passed green over a check that had
      # silently become a no-op. Guard the guard.
      - name: Mutation sweep fails when it proves nothing
        run: |
          cp reference/c/vtp1.h /tmp/vtp1.h.orig
          printf '\n#error deliberately broken\n' >> reference/c/vtp1.h
          if python3 tools/mutate.py --operator offset; then
            echo "::error::mutate.py reported success with a build that cannot compile"
            cp /tmp/vtp1.h.orig reference/c/vtp1.h
            exit 1
          fi
          cp /tmp/vtp1.h.orig reference/c/vtp1.h
          make -C reference/c
          echo "Mutation sweep correctly refuses to pass on a broken build."

      # SPEC.md 12 promises an existing vector never changes meaning within a
      # major version. The corpus is generated, so a schema edit can quietly
      # change what one expects and every other check here would still pass --
      # generator, decoders and runner would simply agree about the new answer.
      # The corpus is compared against itself; this compares it against what it
      # used to say.
      - name: No existing vector changed meaning
        run: python3 tools/check_baseline.py --check

      # The device model is one half; this is the other. Every bug it covers
      # -- sequence numbers burned by unsubscribed notifications, a number
      # returned after a later notification took it, a connection edge handled
      # after the tick had already sent -- reached a real phone before anyone
      # noticed, because none is reachable by a conformance vector and none is
      # in the device model. It drives the REAL pump against a fake GATT link.
      - name: Transport state machine conforms
        run: python3 reference/peripheral/transport_selftest.py

      # The harness is the only thing in this repository meant to run somewhere
      # else -- on a developer's own machine, against firmware nobody here has
      # seen. It therefore has to be trustworthy in both directions, and this
      # checks both: it must report the software peripheral clean, because a
      # tool that fails a conforming device sends somebody rewriting working
      # firmware, and every defect it claims to catch must actually break it.
      #
      # Deliberately run with no Bluetooth library installed. The loopback
      # transport imports nothing platform-specific, so this also proves the
      # checks themselves never reached for the radio.
      - name: Conformance harness conforms, and detects every defect it claims
        run: PYTHONPATH=harness python3 harness/selftest.py

      # ...and the harness's own guard must be capable of failing, for the same
      # reason the mutation sweep's is. A fault defined with no check named
      # against it is a claim nobody is holding to account.
      - name: Harness selftest fails when a defect goes uncaught
        run: |
          cp harness/vtp1_harness/checks/streams.py /tmp/streams.py.orig
          perl -pi -e 's/if seq != 0:/if False:/' harness/vtp1_harness/checks/streams.py
          if PYTHONPATH=harness python3 harness/selftest.py; then
            echo "::error::the selftest passed with seq.first_is_zero disabled"
            cp /tmp/streams.py.orig harness/vtp1_harness/checks/streams.py
            exit 1
          fi
          cp /tmp/streams.py.orig harness/vtp1_harness/checks/streams.py
          echo "Harness selftest correctly refuses to pass on a disabled check."

      # ...and the coverage gate itself must be capable of failing. It asserts
      # that every MUST either has a seeded fault or a stated reason for having
      # none; a check added with neither has to fail this, because the whole
      # point is that a check nobody can break passes silently forever.
      - name: Harness selftest fails when a MUST has no fault and no reason
        run: |
          perl -pi -e 's/^    "info_major_wrong": "info.major",\n//' harness/selftest.py
          perl -pi -e 's/^    "info_major_wrong": .*\n//' harness/vtp1_harness/transport.py
          if PYTHONPATH=harness python3 harness/selftest.py; then
            echo "::error::the selftest passed with info.major uncovered and unexcused"
            git checkout -- harness/selftest.py harness/vtp1_harness/transport.py
            exit 1
          fi
          git checkout -- harness/selftest.py harness/vtp1_harness/transport.py
          echo "Coverage gate correctly refuses an untested MUST."

      # The harness is the only thing here that gets INSTALLED, and an install
      # carries its own copy of the schema, the reference decoder and the
      # software peripheral (pyproject.toml's force-include block). Until now
      # nothing compared that copy against this repository -- so a wheel built
      # from a stale tree tests last week's peripheral against last week's
      # rulebook, agrees with itself completely, and reports green. That is the
      # one way every check above can be right and a developer running the
      # published tool still be told a superseded device conforms.
      #
      # Build it, prove the bundled files are byte-identical to the source, and
      # run the PACKAGED harness against the PACKAGED peripheral.
      - name: Packaged harness carries this repository
        run: |
          python3 -m pip install --quiet build
          python3 -m build --wheel --outdir /tmp/wheel .
          python3 -m venv /tmp/pkgenv
          /tmp/pkgenv/bin/pip install --quiet /tmp/wheel/*.whl
          /tmp/pkgenv/bin/python tools/check_package.py
          /tmp/pkgenv/bin/vtp1-harness --loopback --seconds 3

      # ...and that check must be capable of failing, for the same reason as
      # every other guard here. Change a bundled file without rebuilding and
      # the install is stale by definition.
      - name: Packaged-copy check detects a stale wheel
        run: |
          printf '\n# deliberate drift\n' >> reference/peripheral/vtp_device.py
          if /tmp/pkgenv/bin/python tools/check_package.py; then
            echo "::error::check_package.py passed against a wheel built from a different tree"
            git checkout -- reference/peripheral/vtp_device.py
            exit 1
          fi
          git checkout -- reference/peripheral/vtp_device.py
          echo "Packaged-copy check correctly detects a stale install."

      # The other direction. run.py only ever round-trips payloads that
      # already decoded, so it asks whether an encoder reproduces something
      # valid and never whether it declines something invalid. That gap let an
      # encoder mask an out-of-range identifier into a valid frame for a
      # different one, which no decoder could flag.
      #
      # Run against BOTH references, over the same cases. The predecessor
      # imported the Python encoder directly, so "14/14 producer cases" was a
      # statement about one of the two -- and the C encoder had four
      # malformed-input crashes and a violation of its own "nothing written on
      # failure" contract while every producer run stayed green.
      - name: Encoders refuse what they must — C reference
        run: python3 conformance/produce.py --impl "reference/c/vtp1_producer"

      - name: Encoders refuse what they must — Python reference
        run: python3 conformance/produce.py --impl "python3 reference/python/vtp1_produce.py"

      # A producer suite that cannot fail proves nothing, exactly as for the
      # decode corpus. Stop the encoder refusing an out-of-range identifier and
      # require the suite to notice.
      - name: Producer suite detects a seeded fault
        run: |
          cp reference/c/vtp1_encode.c /tmp/vtp1_encode.c.orig
          perl -pi -e 's/if \(v->id > 0x1FFFFFFFu\)/if (0 \&\& v->id > 0x1FFFFFFFu)/' reference/c/vtp1_encode.c
          make -C reference/c
          if python3 conformance/produce.py --impl "reference/c/vtp1_producer"; then
            echo "::error::A seeded encoder masking fault was not detected"
            cp /tmp/vtp1_encode.c.orig reference/c/vtp1_encode.c
            exit 1
          fi
          cp /tmp/vtp1_encode.c.orig reference/c/vtp1_encode.c
          make -C reference/c
          echo "Seeded producer fault correctly detected."

      # The C encoder's API contract, which no wire vector and no JSON case can
      # reach: a count with no array behind it, and "nothing is written on
      # failure". Both promises were broken and both were invisible to every
      # check above. Sanitised, because a null dereference that happens not to
      # fault is not a pass.
      - name: C encoder honours its API contract (ASan/UBSan)
        run: make -C reference/c san

      # A partial implementation runs the roles it declares (SPEC.md 12). If
      # this stops filtering, a GPS-only decoder is handed CAN vectors and
      # fails conformance for records it never claimed.
      - name: Roles can be declared
        run: |
          python3 conformance/run.py --impl "reference/c/vtp1_cli" --roles gps
          python3 conformance/run.py --impl "reference/c/vtp1_cli" --roles can,monitor
          if python3 conformance/run.py --impl "reference/c/vtp1_cli" --roles nonsense; then
            echo "::error::an unknown role name was accepted"
            exit 1
          fi
          # The producer runner reads the same role table, from the schema.
          python3 conformance/produce.py --impl "reference/c/vtp1_producer" --roles gps
          python3 conformance/produce.py --impl "reference/c/vtp1_producer" --roles can,monitor
