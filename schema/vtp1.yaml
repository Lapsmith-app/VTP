# VTP/1 — machine-readable protocol definition.
#
# THIS FILE IS THE SOURCE OF TRUTH. The tables in SPEC.md, the conformance
# vectors under conformance/vectors/, and the reference codecs are all
# generated from it by tools/generate.py. Never hand-edit a generated file;
# edit this and regenerate.
#
# Compatibility rules that this file must obey (see SPEC.md §9):
#   - Within major 1, a record's `size` NEVER changes.
#   - A field's offset, size, type, units and scale NEVER change.
#   - New in-band data goes into `reserved` bits/bytes; new fields go into
#     extension records.
#   - Enum members may be ADDED. An existing member's value never changes.

protocol:
  name: VTP
  major: 1
  minor: 0
  endianness: little      # every field, every record, no exceptions
  min_att_mtu: 100

# The GATT profile: which attributes exist, what they may do, and what a
# capability bit changes about them. SPEC.md 4.1 is generated from this.
#
# The attribute table is FIXED. Every VTP/1 device exposes every characteristic
# below, whatever its capabilities say, and a role the device does not
# implement is inert rather than missing. Two reasons, and the second is the
# one that bites:
#
#   - Central stacks CACHE the attribute table across connections and some
#     across reboots. A device whose table changes -- because a capability was
#     turned off in firmware, or because a build omitted a role -- hands the
#     client a cached handle for an attribute that is no longer there, and the
#     failure surfaces as a read of the wrong characteristic rather than as a
#     missing one. A fixed table cannot do that.
#   - Discovery then answers one question ("is this VTP/1?") and Info answers
#     the other ("what does it do?"), instead of both half-answering each.
#
# `inert` says what an implemented-but-unused attribute does, because "present"
# without that is an invitation to leave it silently broken.
profile:
  characteristics:
    - name: info
      capability: null            # unconditional; every device answers Info
      properties: [read]
      cccd: none
      written_by: device
      read_by: client
      inert: "never; Info is always meaningful"
      record: info
    - name: gps
      capability: gps
      properties: [notify]
      cccd: notify
      written_by: device
      read_by: client
      inert: "the CCCD exists; no notification is ever sent on it"
      record: gps_fix
    - name: can
      capability: can
      properties: [notify]
      cccd: notify
      written_by: device
      read_by: client
      inert: "the CCCD exists; no notification is ever sent on it"
      record: can_header
    - name: imu
      capability: imu
      properties: [notify]
      cccd: notify
      written_by: device
      read_by: client
      inert: "the CCCD exists; no notification is ever sent on it"
      record: imu_header
    - name: control
      capability: control
      properties: [write, indicate]
      cccd: indicate
      write_type: with-response
      written_by: client
      read_by: client            # the answer indicates back on the same handle
      inert: "the CCCD exists; writes are rejected with an ATT error and no opcode is parsed"
      record: control_response
    - name: monitor_values
      capability: monitor
      properties: [write]
      cccd: none
      write_type: with-response
      written_by: client
      read_by: device
      inert: "writes are rejected with an ATT error and change nothing"
      record: monitor_header
    # Bulk client-to-device transfer, and the only attribute in this table
    # written without a response. AssistNow Offline is tens of kilobytes;
    # pushing that through Control's one-outstanding-request rule (SPEC.md 9)
    # is one round trip per 244 bytes and locks the control plane for seconds.
    #
    # Nothing is lost by dropping the per-write response, because there was
    # never an error to carry: a chunk is only legitimate after
    # GNSS_AID_BEGIN answered `ok`, and every outcome the client cares about
    # -- completeness, integrity, what the receiver made of it -- is reported
    # by GNSS_AID_COMMIT on the plane that already has typed failures.
    - name: aiding
      capability: gnss_aiding
      properties: [write-without-response]
      cccd: none
      write_type: without-response
      written_by: client
      read_by: device
      inert: "writes are silently discarded; a client cannot reach this characteristic legitimately without GNSS_AID_BEGIN having answered ok first"
      record: aid_chunk

  # Info fields that describe a capacity. Each MUST be zero when its capability
  # bit is clear -- SPEC.md 4 already says a capacity of zero means "none", and
  # this is what makes that mechanically checkable rather than a promise.
  capacity:
    gps: [gps_rate_hz, gps_max_rate_hz]
    can: [can_subscription_slots, can_max_frames_per_s]
    imu: [imu_rate_hz, imu_max_rate_hz]
    obd: [obd_poll_slots]

  # Capacities that MUST also be NON-ZERO while their bit is SET (SPEC.md
  # 15): a poll set nothing fits in, or a floor of zero milliseconds,
  # describes a role no conforming exchange can use. A separate table from
  # `capacity` because the zero-when-clear rule is universal while this one
  # is not -- gps_rate_hz is legitimately zero with the bit set (a stopped
  # stream), so requiring non-zero everywhere would outlaw a state SPEC.md
  # 9.6 defines.
  capacity_required:
    obd: [obd_poll_slots]

enums:
  fix_type:
    width: 1
    members:
      - {value: 0, name: none,        desc: "No solution: no position, and no time solution being computed now"}
      - {value: 1, name: dead_reckon, desc: "Dead-reckoning solution only"}
      - {value: 2, name: fix_2d,      desc: "2D position solution"}
      - {value: 3, name: fix_3d,      desc: "3D position solution"}
      - {value: 4, name: gnss_dr,     desc: "Combined GNSS and dead-reckoning"}
      - {value: 5, name: time_only,   desc: "Time solution only, no position"}
  status:
    width: 1
    members:
      - {value: 0, name: ok,                 desc: "Request accepted"}
      - {value: 1, name: unsupported_opcode, desc: "Opcode not implemented"}
      # No longer "or the tag is already outstanding": with one request
      # outstanding (SPEC.md 9) a concurrent request is refused `busy`
      # whatever tag it carries, so bad_params is about parameters again.
      - {value: 2, name: bad_params,         desc: "Parameters malformed or out of range"}
      - {value: 3, name: table_full,         desc: "No free subscription slot"}
      # NOT for CAN. SPEC.md 9.3 forbids refusing a CAN subscription on rate
      # grounds -- the device admits and sheds instead -- so a description
      # naming can_max_frames_per_s described the one use this status does not
      # have. It is for the two rate setters, where the ceiling is a fact the
      # device already knows.
      - {value: 4, name: rate_exceeded,      desc: "Requested rate is above gps_max_rate_hz or imu_max_rate_hz (SPEC.md 9.6). Never used for CAN"}
      # A client is allowed ONE outstanding request (SPEC.md 9), so this is
      # what a device says to a client that pipelines anyway. Kept rather than
      # removed with the queue it used to describe: without it a device meeting
      # such a client must choose between silence and applying a request it
      # cannot answer, and 9.4 forbids both.
      #
      # A response is owed from acceptance until it is SENT (SPEC.md 9), and
      # this refusal is itself a response owed that way -- so a device
      # answering one request and refusing another owes two until both have
      # gone out. Not until CONFIRMED: a client writes again as soon as the
      # response reaches it, so a device owing that long would refuse one doing
      # exactly what SPEC.md 9 asks.
      - {value: 5, name: busy,               desc: "A response is still owed; wait for it, then retry (SPEC.md 9)"}
      - {value: 6, name: needs_encryption,   desc: "Allocated, never sent: encryption is enforced by GATT permission (SPEC.md 10)"}
      - {value: 7, name: unknown_subscription, desc: "No installed subscription with that id and mask"}
  sub_mode:
    width: 1
    # Two modes. Pre-1.0 drafts assigned 2 (on_change) and 3 (every_nth);
    # both were removed before anything shipped -- every_nth because periodic
    # answers the same need with an output rate that does not scale with bus
    # load, on_change because its per-identifier comparison buffer was the
    # single largest RAM demand in the CAN role (RATIONALE 8.4). The values
    # stay unassigned in 1.0 and a receiver treats them as unknown.
    members:
      - {value: 0, name: every_frame, desc: "Forward every frame"}
      - {value: 1, name: periodic,    desc: "arg = minimum interval, ms"}
  channel:
    width: 2
    # What a Monitor device may ask the client for. An enumeration rather than
    # an expression language: the device names a thing, not a computation, so
    # no parser and no shared namespace of variable names is needed on either
    # side. New members may be added in a minor version (SPEC.md 11.4).
    # No zero member, so a zeroed field cannot pass for a real channel.
    members:
      - {value: 1, name: lap_time,           desc: "Elapsed time in the current lap, ms"}
      - {value: 2, name: last_lap_time,      desc: "ms"}
      - {value: 3, name: best_lap_time,      desc: "ms"}
      - {value: 4, name: delta_best,         desc: "Time ahead of or behind the best lap, ms, signed"}
      - {value: 5, name: predicted_lap_time, desc: "ms"}
      - {value: 6, name: lap_number,         desc: "Laps completed in this session, from 1"}
      - {value: 7, name: speed,              desc: "mm/s"}
      - {value: 8, name: session_distance,   desc: "m"}
      - {value: 9, name: session_time,       desc: "ms"}
  power_source:
    width: 1
    # No zero member: "this device cannot tell" is a cleared validity bit,
    # never a reserved value of the field (SPEC.md 1.1). A zeroed byte
    # therefore cannot pass for mains power.
    #
    # These are four answers to "what is this device running on", ordered by
    # how much the device can tell. `external` claims nothing about a battery,
    # so it is the honest answer for the common build -- a USB-C input and a
    # fuel gauge, with no charge-status pin -- which knows it is plugged in,
    # knows the pack is at 40%, and cannot tell charging from charged.
    #
    # `charged` is separate from `charging` for devices that CAN tell, because
    # otherwise such a device has to report `charging` forever and tell a
    # driver the pack is still filling when it stopped an hour ago.
    members:
      - {value: 1, name: external,    desc: "Running from an external supply. Says nothing about a battery: `percent` reports one if the device has one"}
      - {value: 2, name: discharging, desc: "Running from its battery"}
      - {value: 3, name: charging,    desc: "External supply present, battery taking charge"}
      - {value: 4, name: charged,     desc: "External supply present, battery no longer taking charge"}
  aid_format:
    width: 1
    # What the bytes in an aiding transfer ARE. The device forwards them to
    # its receiver without inspecting them, so this is the one thing a client
    # must get right and the one thing it cannot derive: the format belongs to
    # the receiver, not to this protocol.
    #
    # Enumerated rather than a vendor string, for SPEC.md 13.2's reason -- a
    # client cannot fail to understand a declaration in any way except not
    # implementing it. No zero member, so a zeroed field cannot pass for a
    # real format.
    #
    # One member, and deliberately nothing reserved beside it. SPEC.md 11.4
    # lets a minor version ADD an enum member at any time, so allocating a
    # value for a format nobody implements buys exactly nothing that adding it
    # later would not -- there is no collision to avoid and no compatibility
    # cliff to get ahead of. RTCM3 corrections were the candidate and are the
    # illustration: see SPEC.md 14.6 for why they are out of scope, which is a
    # scoping statement rather than a held slot.
    members:
      - {value: 1, name: ubx_mga, desc: "A concatenated sequence of UBX-MGA messages, as served by u-blox AssistNow"}
  aid_result:
    width: 1
    # The outcome of a transfer, which is not the same thing as the outcome of
    # the request that reported it -- see SPEC.md 14.5. No zero member.
    members:
      - {value: 1, name: applied,    desc: "Every chunk arrived, the CRC matched, and the data went to the receiver"}
      - {value: 2, name: incomplete, desc: "One or more chunks are missing; first_missing names the lowest"}
      - {value: 3, name: bad_crc,    desc: "Every chunk arrived and the CRC-32 does not match"}
      - {value: 4, name: rejected,   desc: "The transfer was intact and the receiver refused it"}

bitmasks:
  gps_validity:
    width: 4
    bits:
      - {bit: 0,  name: t_utc,          desc: "t_utc carries a GNSS time solution"}
      - {bit: 1,  name: t_utc_resolved, desc: "Leap seconds fully resolved"}
      - {bit: 2,  name: position,       desc: "lat and lon are valid"}
      - {bit: 3,  name: alt_msl}
      - {bit: 4,  name: alt_ellipsoid}
      - {bit: 5,  name: velocity,       desc: "vel_n, vel_e and vel_d are all valid"}
      - {bit: 6,  name: head_mot}
      - {bit: 7,  name: h_acc}
      - {bit: 8,  name: v_acc}
      - {bit: 9,  name: s_acc}
      - {bit: 10, name: p_dop,          desc: "Clear on a fix reporting no position (SPEC.md 5.2)"}
      - {bit: 11, name: num_sv,         desc: "The device has a satellite count for the solution fix_type names; zero is a count (SPEC.md 5.2)"}
    reserved_from: 12
    reserved_purpose: "Validity for fields added in a later minor"
  fix_flags:
    width: 1
    bits:
      - {bit: 0, name: differential, desc: "Differential corrections applied"}
      - {bit: 1, name: rtk_float}
      - {bit: 2, name: rtk_fixed}
      - {bit: 3, name: clock_disciplined, desc: "t_device was GNSS-disciplined at this sample"}
      - {bit: 4, name: solution_epoch, desc: "t_device is the epoch of the solution; when clear it is when the fix reached the device (SPEC.md 5.6)"}
    reserved_from: 5
    reserved_purpose: "Additional solution-quality flags"
  capabilities:
    width: 4
    # `implies` is normative, not documentation: SPEC.md 4.1 renders it as a
    # matrix and the encoders refuse an Info that breaks it. It used to be
    # absent, so the specification defined every bit independently while
    # conformance/run.py quietly made CAN and Monitor imply Control -- the
    # runner enforcing a rule the specification did not state, and canonical
    # Info vectors blessing a CAN device with no Control characteristic that
    # no client could ever subscribe anything on.
    bits:
      - {bit: 0, name: gps}
      - {bit: 1, name: can, implies: [control]}
      - {bit: 2, name: imu}
      - {bit: 3, name: monitor, implies: [control],
         desc: "Device asks the client for values to display (§13)"}
      - {bit: 4, name: control}
      - {bit: 5, name: can_fd, implies: [can]}
      - {bit: 6, name: masked_subscriptions, implies: [can]}
      # Bit 7 was on_change_subscriptions and is deliberately not renumbered
      # over: a capability bit is a wire value, and reusing it would make a
      # device built against the draft that assigned it indistinguishable from
      # one meaning whatever bit 7 says next. It is reserved like bits 11+,
      # and the generated masks treat every unnamed bit the same way.
      #
      # Bit 8 is the first capability the advertisement cannot carry: SPEC.md
      # 3.3's Service Data block holds bits 0-7 and its size is fixed. That is
      # not a defect here -- a supply reading is something a client draws after
      # it connects, not something it ranks devices by before it does.
      - {bit: 8, name: power, implies: [control],
         desc: "Device reports its own power state (SPEC.md 9.7)"}
      # Bit 9 for the same reason bit 8 is not advertised: aiding is something
      # a client does after it connects.
      - {bit: 9, name: gnss_aiding, implies: [gps, control],
         desc: "Client supplies orbit data to the device's receiver (§14)"}
      # Bit 10 is the first capability that is a claim about the BUS rather
      # than about this device's own sensing: a device that sets it TRANSMITS
      # on the vehicle's CAN bus. Every earlier role observes -- GPS listens
      # to satellites, CAN listens to the bus, IMU listens to itself -- and
      # this device class is sold on being unable to disturb a moving car.
      # The bit exists so that claim stays expressible once polling exists at
      # all: without it, responses simply appearing on 0x7E8 would be an
      # undeclared convention, and a user plugging a dongle into their car
      # could not find out whether it transmits. RATIONALE 11.
      #
      # Info is read every connection and never cached (SPEC.md 4), so the
      # bit describes THIS connection, not the model: a device with a
      # physical listen-only switch clears it while the switch is set.
      - {bit: 10, name: obd, implies: [can, control],
         desc: "Device transmits OBD-II diagnostic requests on the bus (§15)"}
    reserved_from: 11
    reserved_purpose: "Roles and features added in a later minor"
  # These three were plain u8 fields with a prose description, so nothing
  # derived their reserved ranges: Appendix A listed them by hand and went
  # stale, and neither encoder masked them, which is the one rule SPEC.md 2
  # states about reserved bits.
  can_flags:
    width: 1
    bits:
      - {bit: 0, name: shedding, desc: "Device is discarding accepted frames (SPEC.md 6.3)"}
      # Capability bit 10 says a device CAN transmit; this says it currently
      # IS. On every batch rather than only in a control response, because
      # the person who most needs the answer -- whoever plugged the dongle
      # into a car -- is not necessarily the one who sent OBD_POLL_SET, and
      # because it is what makes SPEC.md 15.7's stop rules observable: after
      # CAN_RESET or an empty poll set, the next batch says whether the
      # transmitter actually stopped.
      - {bit: 1, name: polling, desc: "The OBD poll set is non-empty: this device is transmitting diagnostic requests (SPEC.md 15.6)"}
    reserved_from: 2
    reserved_purpose: "Additional batch-level CAN status"
  imu_flags:
    width: 1
    bits:
      - {bit: 0, name: accel, desc: "Accelerometer triple is present"}
      - {bit: 1, name: gyro,  desc: "Gyroscope triple is present"}
      - {bit: 2, name: saturated, desc: "A sample in this batch hit the sensor's limit (SPEC.md 7.2)"}
    reserved_from: 3
    reserved_purpose: "Additional sensor groups"
  clock_flags:
    width: 1
    bits:
      - {bit: 0, name: gnss_disciplined, desc: "The device clock is disciplined by GNSS"}
      - {bit: 1, name: survives_reconnect, desc: "The device clock does not restart when the link drops"}
    reserved_from: 2
    reserved_purpose: "Additional clock properties"
  monitor_validity:
    width: 1
    bits:
      - {bit: 0, name: present, desc: "The client can currently supply this channel"}
    reserved_from: 1
    reserved_purpose: "Validity for values added in a later minor"
  power_validity:
    width: 1
    # Two bits rather than one, because a device knows these separately: one
    # wired to the ignition feed knows it is on external power and has no
    # charge to report, and one whose gauge has failed knows the opposite.
    # SPEC.md 9.7.
    bits:
      - {bit: 0, name: source,  desc: "source is valid"}
      - {bit: 1, name: percent, desc: "percent is valid"}
    reserved_from: 2
    reserved_purpose: "Validity for power fields added in a later minor"
  aid_validity:
    width: 1
    bits:
      - {bit: 0, name: held_until, desc: "held_until carries the end of a window the device already holds"}
    reserved_from: 1
    reserved_purpose: "Validity for aiding capabilities added in a later minor"
  commit_validity:
    width: 1
    bits:
      - {bit: 0, name: first_missing, desc: "first_missing names a chunk the device did not receive"}
    reserved_from: 1
    reserved_purpose: "Validity for commit results added in a later minor"
  obd_validity:
    width: 1
    # One bit gating four fields, because they are one measurement: a probe
    # that nothing answered has no request identifier that worked and no
    # masks that were read. Splitting them would let a device report masks
    # from a car that never replied.
    bits:
      - {bit: 0, name: responded, desc: "An OBD-II ECU answered the probe; request_id and the three supported masks are valid"}
    reserved_from: 1
    reserved_purpose: "Validity for probe results added in a later minor"

records:

  info:
    characteristic: info
    size: 24
    access: read
    desc: "Device self-description. Read once per connection; never cached across connections."
    fields:
      - {name: protocol_major, offset: 0,  size: 1, type: u8,  desc: "MUST equal 1; cross-check against the discovered service UUID"}
      - {name: protocol_minor, offset: 1,  size: 1, type: u8}
      - {name: capabilities,   offset: 2,  size: 4, type: u32, bitmask: capabilities}
      - {name: gps_rate_hz,    offset: 6,  size: 2, type: u16, units: Hz, desc: "Current rate; 0 if no GPS"}
      - {name: gps_max_rate_hz, offset: 8, size: 2, type: u16, units: Hz}
      - {name: can_subscription_slots, offset: 10, size: 2, type: u16}
      - {name: can_max_frames_per_s,   offset: 12, size: 4, type: u32, units: "frames/s"}
      - {name: imu_rate_hz,     offset: 16, size: 2, type: u16, units: Hz}
      - {name: imu_max_rate_hz, offset: 18, size: 2, type: u16, units: Hz}
      # Byte 20 was `can_max_payload` -- removed because every value it could
      # hold was derivable from the capability bits (SPEC.md 4.1 derives it
      # now) -- then a reserved byte. Assigned to the OBD role's slot count
      # per SPEC.md 11.2: older firmware writes it as zero, which is exactly
      # what "no OBD" means, so the assignment costs nothing that was not
      # already true.
      - {name: obd_poll_slots, offset: 20, size: 1, type: u8, desc: "Most PIDs one OBD_POLL_SET may name (SPEC.md 15.4); 0 if no OBD"}
      - {name: clock_flags,     offset: 21, size: 1, type: u8, bitmask: clock_flags}
      # Bytes 22-23 were `max_notify_bytes` -- removed as a restatement of
      # the negotiated ATT payload -- then reserved. Assigned to the OBD
      # role's transmit floor per SPEC.md 11.2, on the same zero-reads-right
      # argument as byte 20. A capacity rather than a response detail because
      # a client must read it BEFORE choosing an interval: SPEC.md 9.6's
      # rate_exceeded precedent -- the ceiling is a fact the client could
      # have read in advance -- applies to a floor identically.
      - {name: reserved_22, offset: 22, size: 2, type: u16, reserved: true, desc: "Was obd_min_interval_ms; withdrawn with the fixed poll clock (SPEC.md 15.4)"}

  gps_fix:
    characteristic: gps
    size: 74
    access: notify
    extensible: true
    validity: gps_validity
    desc: "One complete GNSS solution. Never split, never paired, never packed."
    fields:
      - {name: seq,      offset: 0,  size: 2, type: u16, desc: "Notifications sent on this characteristic; +1 each, wraps, restarts at 0 per connection"}
      - {name: dropped,  offset: 2,  size: 2, type: u16, desc: "Fixes accepted then discarded since the previous notification; saturates, never wraps"}
      - {name: validity, offset: 4,  size: 4, type: u32, bitmask: gps_validity}
      - {name: t_device, offset: 8,  size: 8, type: u64, units: µs,  desc: "Monotonic device clock (§8.1)"}
      - {name: t_utc,    offset: 16, size: 8, type: i64, units: ms,  desc: "Unix epoch", valid_bit: t_utc}
      - {name: lat,      offset: 24, size: 4, type: i32, units: deg, scale: 1.0e-7, valid_bit: position, desc: "Latitude — positive north, negative south"}
      - {name: lon,      offset: 28, size: 4, type: i32, units: deg, scale: 1.0e-7, valid_bit: position, desc: "Longitude — positive east, negative west"}
      - {name: alt_msl,       offset: 32, size: 4, type: i32, units: mm, valid_bit: alt_msl, desc: "Altitude above mean sea level"}
      - {name: alt_ellipsoid, offset: 36, size: 4, type: i32, units: mm, valid_bit: alt_ellipsoid, desc: "Altitude above the WGS-84 ellipsoid"}
      - {name: vel_n,    offset: 40, size: 4, type: i32, units: mm/s, valid_bit: velocity, desc: "Velocity, north component"}
      - {name: vel_e,    offset: 44, size: 4, type: i32, units: mm/s, valid_bit: velocity, desc: "Velocity, east component"}
      - {name: vel_d,    offset: 48, size: 4, type: i32, units: mm/s, valid_bit: velocity, desc: "Velocity, down component — positive descending"}
      - {name: head_mot, offset: 52, size: 4, type: i32, units: deg, scale: 1.0e-5, valid_bit: head_mot, desc: "Heading of motion, clockwise from true north"}
      - {name: h_acc,    offset: 56, size: 4, type: u32, units: mm,   desc: "Horizontal position accuracy estimate, 1 sigma", valid_bit: h_acc}
      - {name: v_acc,    offset: 60, size: 4, type: u32, units: mm,   desc: "Vertical position accuracy estimate, 1 sigma", valid_bit: v_acc}
      - {name: s_acc,    offset: 64, size: 4, type: u32, units: mm/s, desc: "Speed accuracy estimate, 1 sigma", valid_bit: s_acc}
      - {name: p_dop,    offset: 68, size: 2, type: u16, scale: 0.01, valid_bit: p_dop, desc: "Position dilution of precision; absent on a fix reporting no position (SPEC.md 5.2)"}
      - {name: fix_type, offset: 70, size: 1, type: u8, enum: fix_type}
      - {name: num_sv,   offset: 71, size: 1, type: u8, valid_bit: num_sv, desc: "Satellites used in the solution fix_type names, positional or not (SPEC.md 5.2)"}
      - {name: fix_flags, offset: 72, size: 1, type: u8, bitmask: fix_flags}
      - {name: ext_count, offset: 73, size: 1, type: u8, desc: "Extension records following the base record"}

  can_header:
    characteristic: can
    size: 16
    access: notify
    desc: "Batch header. Followed by `count` can_record entries."
    fields:
      - {name: seq,     offset: 0,  size: 2, type: u16, desc: "Notifications sent on this characteristic; +1 each, wraps, restarts at 0 per connection"}
      - {name: dropped, offset: 2,  size: 2, type: u16, desc: "Frames accepted then discarded since the previous notification; excludes frames no subscription matched or a subscription mode did not select; saturates"}
      # Record 0 always exists: count is never zero (SPEC.md 6.2), so this
      # timestamp always names a frame that was actually received.
      - {name: t_base,  offset: 4,  size: 8, type: u64, units: µs, desc: "Bus-arrival time of record 0, on the device clock (§8.1)"}
      - {name: count,   offset: 12, size: 1, type: u8}
      - {name: flags,   offset: 13, size: 1, type: u8, bitmask: can_flags}
      - {name: reserved, offset: 14, size: 2, type: u16, reserved: true, desc: "Low byte earmarked for a bus index (SPEC.md 6.9); high byte unassigned"}

  can_record:
    size: 7          # plus `len` payload bytes
    variable: payload
    desc: "One CAN frame with a device-measured bus-arrival time."
    fields:
      - {name: dt,  offset: 0, size: 2, type: u16, units: "10µs", desc: "Ticks since this batch's own t_base; window is 0..655.35 ms"}
      - {name: id,  offset: 2, size: 4, type: u32, desc: "bits 0-28 arbitration id; b29 extended; b30 CAN FD; b31 RTR"}
      - {name: len, offset: 6, size: 1, type: u8,  desc: "Payload length; Classic 0..8, CAN FD a DLC rung (SPEC.md 6.10)"}

  imu_header:
    characteristic: imu
    size: 20
    access: notify
    desc: "Batch header. Followed by `count` evenly spaced imu_sample entries."
    fields:
      - {name: seq,     offset: 0,  size: 2, type: u16, desc: "Notifications sent on this characteristic; +1 each, wraps, restarts at 0 per connection"}
      - {name: dropped, offset: 2,  size: 2, type: u16, desc: "Samples accepted then discarded since the previous notification; saturates, never wraps"}
      - {name: t_base,  offset: 4,  size: 8, type: u64, units: µs, desc: "Device-clock timestamp of sample 0 (§8.1)"}
      # u32 rather than u16: a u16 microsecond period cannot express any rate
      # below 15.26 Hz, so a 10 Hz IMU was unrepresentable. Microseconds rather
      # than a finer unit so this shares the device clock's units with GPS and
      # CAN -- cross-channel alignment is the point, and a second scale would
      # be a division at every comparison.
      - {name: period,  offset: 12, size: 4, type: u32, units: µs, desc: "Interval between consecutive samples"}
      - {name: count,   offset: 16, size: 1, type: u8}
      - {name: flags,   offset: 17, size: 1, type: u8, bitmask: imu_flags}
      - {name: reserved, offset: 18, size: 2, type: u16, reserved: true, desc: "In-band IMU metadata"}

  imu_sample:
    size: 12
    desc: "Sensor-frame acceleration and rotation. Vehicle alignment is the client's job."
    # A sample carries no mask of its own: presence is declared once per batch
    # in imu_header.flags. Stating that here rather than in prose is what lets
    # the encoder gating, the decoder's absent set and the corpus completeness
    # check all derive it, instead of each reimplementing SPEC.md 7 by hand.
    presence: {record: imu_header, field: flags, bits: {accel: 0, gyro: 1}}
    fields:
      - {name: ax, offset: 0,  size: 2, type: i16, units: mg,     desc: "milli-g", presence_bit: accel}
      - {name: ay, offset: 2,  size: 2, type: i16, units: mg, presence_bit: accel}
      - {name: az, offset: 4,  size: 2, type: i16, units: mg, presence_bit: accel}
      - {name: gx, offset: 6,  size: 2, type: i16, units: deg/s, scale: 0.05, presence_bit: gyro}
      - {name: gy, offset: 8,  size: 2, type: i16, units: deg/s, scale: 0.05, presence_bit: gyro}
      - {name: gz, offset: 10, size: 2, type: i16, units: deg/s, scale: 0.05, presence_bit: gyro}

  # Not paged, and not a page. The whole declaration is at most 15 channels
  # (SPEC.md 13.4, the most that fit in one complete client write at the
  # minimum ATT MTU), which is 2 + 15*4 = 62 bytes -- inside the 97 a response
  # has at that MTU with room to spare. A page index could never be anything
  # but zero, so there is none.
  monitor_declaration:
    access: control
    size: 2
    desc: "Every channel this device asks the client to supply. Followed by `count` monitor_channel entries."
    fields:
      - {name: count,    offset: 0, size: 1, type: u8,  desc: "Channels requested; the whole declaration, never a page of it"}
      - {name: reserved, offset: 1, size: 1, type: u8,  reserved: true, desc: "Declaration metadata"}

  monitor_channel:
    access: control
    size: 4
    desc: "One channel a device asks the client to supply."
    fields:
      - {name: slot,     offset: 0, size: 1, type: u8,  desc: "The device's own name for this value; used in monitor_value"}
      - {name: channel,  offset: 1, size: 2, type: u16, enum: channel}
      # Zero is forbidden. This field carried "0 never expires" while SPEC.md
      # 13.5 said zero meant no deadline of its own and then derived a
      # device-wide "liveness bound" to expire it anyway -- two rules, a
      # derived concept to reconcile them, and a canonical vector that
      # satisfied neither. One deadline per channel, always present, is the
      # whole rule now.
      - {name: max_age,  offset: 3, size: 1, type: u8,  units: "100ms", desc: "Longest this value may be shown without a refresh; MUST NOT be zero (SPEC.md 13.5)"}

  monitor_header:
    characteristic: monitor_values
    size: 4
    access: write
    desc: "Batch header for a client-to-device value update. Followed by `count` monitor_value entries."
    fields:
      - {name: seq,      offset: 0, size: 2, type: u16, desc: "Updates written by the client; +1 each, wraps, restarts at 0 per connection"}
      - {name: count,    offset: 2, size: 1, type: u8}
      - {name: reserved, offset: 3, size: 1, type: u8, reserved: true, desc: "Update metadata"}

  monitor_value:
    size: 6
    validity: monitor_validity
    desc: "One value for a slot the device asked for."
    fields:
      - {name: slot,     offset: 0, size: 1, type: u8}
      - {name: validity, offset: 1, size: 1, type: u8, bitmask: monitor_validity}
      - {name: value,    offset: 2, size: 4, type: i32, valid_bit: present}

  control_response:
    access: control
    size: 3          # plus an opaque detail when status is ok
    variable: detail
    desc: "The envelope of every Control response. Detail follows only when status is ok."
    fields:
      - {name: opcode, offset: 0, size: 1, type: u8, desc: "Echoed from the request"}
      - {name: tag,    offset: 1, size: 1, type: u8, desc: "Echoed from the request; opaque to the device"}
      - {name: status, offset: 2, size: 1, type: u8, enum: status}

  time_sync:
    access: control
    size: 16
    desc: "The detail of a TIME_SYNC response. Two readings of one clock, so a client can bound its own error."
    fields:
      - {name: t_device_rx, offset: 0, size: 8, type: u64, units: µs, desc: "Device clock when the request arrived"}
      - {name: t_device_tx, offset: 8, size: 8, type: u64, units: µs, desc: "Device clock when this answer was prepared; MUST NOT be earlier than t_device_rx"}

  power_state:
    access: control
    size: 4
    validity: power_validity
    desc: "The detail of a GET_POWER response. What the device knows about its own supply, and no more."
    fields:
      - {name: validity, offset: 0, size: 1, type: u8, bitmask: power_validity}
      # `source` rather than a battery-present flag, and it is the field that
      # keeps `percent` honest: without it a device on the car's ignition feed
      # has to report 100% forever, which is a magic value meaning "not
      # applicable" in a field a client renders as a gauge. SPEC.md 1.1 is
      # about exactly that, and one byte closes it.
      - {name: source,   offset: 1, size: 1, type: u8, enum: power_source, valid_bit: source}
      # 0..100 and nothing else. The bound is the device's: an encoder
      # refuses a larger value rather than clamping it, and a receiver
      # decodes the record and SHOULD flag the field (SPEC.md 9.7) -- the
      # malformed/content division SPEC.md 1.1 draws.
      - {name: percent,  offset: 2, size: 1, type: u8, units: "%", valid_bit: percent,
         desc: "Charge remaining, 0..100; a device MUST NOT emit a larger value (SPEC.md 9.7)"}
      - {name: reserved, offset: 3, size: 1, type: u8, reserved: true, desc: "Power metadata"}
  gnss_aid_caps:
    access: control
    size: 16
    validity: aid_validity
    desc: "What aiding this device accepts, and what it already holds."
    fields:
      - {name: validity,   offset: 0, size: 1, type: u8, bitmask: aid_validity}
      - {name: format,     offset: 1, size: 1, type: u8, enum: aid_format, desc: "The one format this device accepts"}
      # Bytes 2-3 held an aid_flags bitmask whose one bit, `persists`, said
      # whether held_until survives a power cycle. But a client MUST read
      # GNSS_AID_INFO on every connection (SPEC.md 14.1), and THAT read says
      # what the device holds now -- a prediction about the next boot was a
      # value nothing could act on. Removed; see RATIONALE.
      - {name: reserved_2, offset: 2, size: 2, type: u16, reserved: true, desc: "Was aid_flags; aiding metadata"}
      - {name: max_bytes,  offset: 4, size: 4, type: u32, units: bytes, desc: "Largest total_bytes this device will accept in one transfer"}
      # Same type and units as gps_fix.t_utc, deliberately: a client comparing
      # the two should not have to convert.
      - {name: held_until, offset: 8, size: 8, type: i64, units: ms, valid_bit: held_until,
         desc: "Unix epoch; the end of the validity window this device already holds (SPEC.md 14.2)"}

  aid_begin_result:
    access: control
    size: 4
    desc: "The detail of a GNSS_AID_BEGIN response. Opens a transfer and fixes its chunking."
    fields:
      # A draft of the review that trimmed this role removed the token, on
      # the argument that ATT orders a client's writes so a stale chunk
      # cannot cross a BEGIN. That is true of one bearer and false of a
      # client: EATT (Core 5.2) allows several ATT bearers, ordered only
      # within each, so a chunk queued on one CAN arrive after a superseding
      # BEGIN sent on another. The token is what keeps it out of the new
      # transfer -- RATIONALE 10.6.
      - {name: token,       offset: 0, size: 1, type: u8, desc: "Names this transfer; echoed in every chunk. MUST differ from the previous transfer's (SPEC.md 14.3)"}
      # Fixed, not per-chunk, because index-to-offset must be arithmetic. With
      # variable chunks a device cannot place chunk 7 without having received
      # 0..6, and resending only the gap -- the entire point of reporting
      # first_missing -- stops working.
      - {name: chunk_bytes, offset: 1, size: 2, type: u16, units: bytes, desc: "Payload bytes in every chunk but the last; byte offset is index x chunk_bytes (SPEC.md 14.3)"}
      - {name: reserved_3,  offset: 3, size: 1, type: u8, reserved: true, desc: "Transfer metadata"}

  aid_chunk:
    characteristic: aiding
    size: 3          # plus the payload bytes of this chunk
    access: write
    variable: payload
    desc: "One chunk of an aiding transfer, written without a response."
    fields:
      - {name: token, offset: 0, size: 1, type: u8, desc: "Echoed from the GNSS_AID_BEGIN that opened this transfer"}
      - {name: index, offset: 1, size: 2, type: u16, desc: "0-based; the payload belongs at index x chunk_bytes"}

  aid_commit_result:
    access: control
    size: 4
    validity: commit_validity
    desc: "The detail of a GNSS_AID_COMMIT response. What became of the transfer."
    fields:
      - {name: validity,      offset: 0, size: 1, type: u8, bitmask: commit_validity}
      - {name: result,        offset: 1, size: 1, type: u8, enum: aid_result}
      - {name: first_missing, offset: 2, size: 2, type: u16, valid_bit: first_missing,
         desc: "Lowest chunk index the device did not receive; the client resends from here (SPEC.md 14.4)"}

  # SPEC.md 15.2. The detail of an OBD_INFO response: what the car in front
  # of the device answered, measured when asked -- GET_POWER's shape, not a
  # cached datasheet. Deliberately about the CAR where Info's two OBD fields
  # are about the DEVICE; conflating them was considered and rejected because
  # Info is constant per connection and the car is not (RATIONALE 11.4).
  #
  # The three masks carry the UNION over responding ECUs, not a mask per ECU.
  # Per-ECU masks are 12 bytes an entry, and eight ECUs of them do not fit a
  # control response at the minimum ATT MTU; the union answers the question
  # the client actually asks -- "may this PID go in the poll set" -- and
  # per-ECU attribution is already carried by the response identifier on
  # every answering frame. The cost is stated in SPEC.md 15.3 rather than
  # discovered.
  obd_probe:
    access: control
    size: 20
    validity: obd_validity
    desc: "The detail of an OBD_INFO response. What the car answered, measured when asked. Followed by `count` obd_ecu entries."
    fields:
      - {name: validity, offset: 0, size: 1, type: u8, bitmask: obd_validity}
      # Not gated: count is what the receiver walks the payload by, so it is
      # layout, not content. Its agreement with `responded` -- zero if and
      # only if the bit is clear -- is a content rule (SPEC.md 15.2), decoded
      # and flagged rather than rejected.
      - {name: count, offset: 1, size: 1, type: u8, desc: "obd_ecu entries following; MUST be 0 exactly when `responded` is clear, and at most 8 (SPEC.md 15.2)"}
      # Identifier layout shared with can_record.id and CAN_SUBSCRIBE: bits
      # 0-28 arbitration, bit 29 the format bit. So 11-versus-29-bit
      # addressing is DERIVED from the identifier rather than stated beside
      # it, and the value drops straight into a subscription's `id`.
      - {name: request_id, offset: 2, size: 4, type: u32, valid_bit: responded,
         desc: "The identifier this device transmits requests on; bits 0-28 arbitration id, b29 extended, bits 30-31 MUST be zero (SPEC.md 15.2)"}
      - {name: supported_01_20, offset: 6, size: 4, type: u32, valid_bit: responded,
         desc: "Union over responding ECUs of Mode 01 PID support; bit n = PID 0x01+n, LSB first (SPEC.md 15.3)"}
      - {name: supported_21_40, offset: 10, size: 4, type: u32, valid_bit: responded,
         desc: "As supported_01_20 for PIDs 0x21-0x40; bit n = PID 0x21+n (SPEC.md 15.3)"}
      - {name: supported_41_60, offset: 14, size: 4, type: u32, valid_bit: responded,
         desc: "As supported_01_20 for PIDs 0x41-0x60; bit n = PID 0x41+n (SPEC.md 15.3)"}
      - {name: reserved_18, offset: 18, size: 2, type: u16, reserved: true, desc: "Probe metadata"}

  obd_ecu:
    access: control
    size: 4
    desc: "One ECU that answered the probe, named by the identifier it responds on."
    fields:
      # Same identifier layout as request_id, for the same reason: these are
      # the identifiers SPEC.md 15.5's fallback delivers on while a poll set
      # is active, and the value drops straight into a CAN_SUBSCRIBE `id`
      # when a client chooses to govern that delivery itself.
      - {name: id, offset: 0, size: 4, type: u32,
         desc: "Response identifier; bits 0-28 arbitration id, b29 extended, bits 30-31 MUST be zero. Entries strictly ascending over bits 0-29 (SPEC.md 15.2)"}

control:
  request:  "[opcode:u8][tag:u8][params...]"
  response: "[opcode:u8][tag:u8][status:u8][detail...]"
  # `capability` is the bit that OWNS the opcode. A device without it answers
  # unsupported_opcode, and answers it before looking at the parameters --
  # SPEC.md 9 states that order, because "which of these two refusals do I
  # get" is otherwise a coin toss between implementations.
  #
  # It was absent, so the matrix said which bits a device may set and nothing
  # said what any of them CHANGED about the control plane. The reference
  # peripheral duly answered `ok` to CAN_SUBSCRIBE, GPS_SET_RATE, IMU_SET_RATE
  # and MONITOR_LIST while declaring only `control`.
  #
  # TIME_SYNC has no owning capability: it is about the clock, which every
  # device has, and reaching it at all means the Control characteristic is
  # live.
  #
  # 0x05 (CAN_LIST) and 0x31 (GET_LINK_PARAMS) were assigned by pre-1.0
  # drafts and removed before anything shipped: a client that reprograms its
  # subscriptions on every connection (SPEC.md 9.1) already knows the table,
  # and link diagnostics are bench tooling rather than telemetry. Both values
  # stay unassigned in 1.0 so a later minor can revive either unchanged.
  opcodes:
    - {value: 0x01, name: CAN_RESET,          capability: can,     params: "",                            response: "",                      desc: "Clear all subscriptions, clear the OBD poll set (SPEC.md 15.7), and stop the CAN stream"}
    - {value: 0x02, name: CAN_SUBSCRIBE,      capability: can,     params: "id:u32, mode:u8, arg:u16",     response: "",                      desc: "Equivalent to CAN_SUBSCRIBE_MASK with mask 0x3FFFFFFF"}
    - {value: 0x03, name: CAN_SUBSCRIBE_MASK, capability: masked_subscriptions, params: "id:u32, mask:u32, mode:u8, arg:u16", response: ""}
    - {value: 0x04, name: CAN_UNSUBSCRIBE,    capability: can,     params: "id:u32, mask:u32",             response: "",                      desc: "Removes the subscription whose id and mask these are (SPEC.md 9.1)"}
    # SPEC.md 9.6. `hz` of zero stops the stream; a rate the device does not
    # support is bad_params, never a silently substituted neighbour. The
    # applied rate is read back from Info, so there is no response detail to
    # keep in step with it.
    - {value: 0x10, name: GPS_SET_RATE,       capability: gps,     params: "hz:u16",                       response: "",                      desc: "0 stops the stream; unsupported rates answer bad_params (SPEC.md 9.6)"}
    # SPEC.md 14. Three opcodes rather than one because a bulk transfer has
    # three distinct moments on this plane -- ask what is wanted, open,
    # close -- and only the filling is high volume. The filling is therefore
    # the only part that leaves it. 0x14 was GNSS_AID_ABORT and is
    # unassigned: a transfer is abandoned by opening another or by
    # disconnecting (SPEC.md 14.3), and an opcode whose whole effect the next
    # BEGIN already has is a second name for the same act.
    - {value: 0x11, name: GNSS_AID_INFO,   capability: gnss_aiding, params: "",                                  response: "gnss_aid_caps record",     desc: "What aiding this device accepts, and what it already holds (SPEC.md 14.2)"}
    - {value: 0x12, name: GNSS_AID_BEGIN,  capability: gnss_aiding, params: "format:u8, total_bytes:u32",         response: "aid_begin_result record",  desc: "Open a transfer; the response fixes the chunk size (SPEC.md 14.3)"}
    - {value: 0x13, name: GNSS_AID_COMMIT, capability: gnss_aiding, params: "crc32:u32",                          response: "aid_commit_result record", desc: "Close the open transfer and report what became of it (SPEC.md 14.4)"}
    - {value: 0x20, name: IMU_SET_RATE,       capability: imu,     params: "hz:u16",                       response: "",                      desc: "0 stops the stream; unsupported rates answer bad_params (SPEC.md 9.6)"}
    # params is the empty string, not a dash. It carried a literal em-dash,
    # which is how the SPEC.md table renders "no parameters" -- the display
    # form had been written into the source of truth, so the schema said this
    # opcode took one parameter whose name and type were both the character
    # "-", while SPEC.md 9 said it was parameterless. tools/generate.py now
    # refuses the dash outright.
    - {value: 0x30, name: TIME_SYNC,          capability: null,    params: "",                             response: "time_sync record",      desc: "The device clock when the request arrived and when the answer was prepared (SPEC.md 9.5)"}
    - {value: 0x40, name: MONITOR_LIST,       capability: monitor, params: "",                             response: "monitor_declaration record", desc: "Every channel this device asks the client to supply, in one response (SPEC.md 13.3)"}
    # 0x50 rather than 0x31, so the 0x3x block keeps meaning "every device
    # answers this". Power is a role with a bit of its own, and putting it
    # beside TIME_SYNC would file an opcode a device may refuse next to the
    # one it never may.
    - {value: 0x50, name: GET_POWER,          capability: power,   params: "",                             response: "power_state record",    desc: "What the device knows about its own supply, measured when asked (SPEC.md 9.7)"}
    # SPEC.md 15. The OBD role: the first opcodes whose effect is on the
    # VEHICLE rather than on the device, which is why both belong to a
    # capability bit of their own rather than riding on `can`. Two opcodes
    # and not three: there is no OBD_POLL_STOP, because a poll set is a
    # complete statement (SPEC.md 15.4) and the empty one already says stop
    # -- the GNSS_AID_ABORT argument, one section over.
    #
    # OBD_INFO transmits. It is the probe, and SPEC.md 15.2 makes it the
    # first frame a device may ever put on the bus -- so the sequence a
    # client follows is declare (Info bit 10), verify (OBD_INFO), use
    # (OBD_POLL_SET), and the first transmission is one the client asked for.
    #
    # `pids:u8*` is the one variadic parameter list in this table: `count`
    # u8 values follow, one per list entry. The poll set is ORDERED and MAY
    # repeat a PID -- [0C, 0D, 0C, 05] samples 0x0C twice per cycle -- which
    # is how relative rates exist without per-PID rate fields (SPEC.md 15.4).
    - {value: 0x60, name: OBD_INFO,     capability: obd, params: "",                              response: "obd_probe record", desc: "Probe the bus and report what answered; replaces the probe result and clears the poll set (SPEC.md 15.2)"}
    - {value: 0x61, name: OBD_POLL_SET, capability: obd, params: "interval_ms:u16, count:u8, schedule:u8*", response: "",                 desc: "Replace the whole poll set; count 0 stops transmitting. Response-paced: interval_ms is a MINIMUM spacing and 0 means none (SPEC.md 15.4). Bit 7 of a PID byte groups it with the next and each group carries a u16 minimum interval in ms (SPEC.md 15.4.1, 15.4.2)"}
