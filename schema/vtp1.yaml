# VTP/1 — machine-readable protocol definition.
#
# THIS FILE IS THE SOURCE OF TRUTH. The tables in SPEC.md, the conformance
# vectors under conformance/vectors/, and the reference codecs are all
# generated from it by tools/generate.py. Never hand-edit a generated file;
# edit this and regenerate.
#
# Compatibility rules that this file must obey (see SPEC.md §9):
#   - Within major 1, a record's `size` NEVER changes.
#   - A field's offset, size, type, units and scale NEVER change.
#   - New in-band data goes into `reserved` bits/bytes; new fields go into
#     extension records.
#   - Enum members may be ADDED. An existing member's value never changes.

protocol:
  name: VTP
  major: 1
  minor: 0
  endianness: little      # every field, every record, no exceptions
  min_att_mtu: 100

enums:
  fix_type:
    width: 1
    members:
      - {value: 0, name: none,        desc: "No position solution"}
      - {value: 1, name: dead_reckon, desc: "Dead-reckoning solution only"}
      - {value: 2, name: fix_2d,      desc: "2D position solution"}
      - {value: 3, name: fix_3d,      desc: "3D position solution"}
      - {value: 4, name: gnss_dr,     desc: "Combined GNSS and dead-reckoning"}
      - {value: 5, name: time_only,   desc: "Time solution only, no position"}
  status:
    width: 1
    members:
      - {value: 0, name: ok,                 desc: "Request accepted"}
      - {value: 1, name: unsupported_opcode, desc: "Opcode not implemented"}
      - {value: 2, name: bad_params,         desc: "Parameters malformed or out of range"}
      - {value: 3, name: table_full,         desc: "No free subscription slot"}
      - {value: 4, name: rate_exceeded,      desc: "Would exceed can_max_frames_per_s"}
      - {value: 5, name: busy,               desc: "Retry later"}
      - {value: 6, name: needs_encryption,   desc: "Link is not encrypted"}
  sub_mode:
    width: 1
    members:
      - {value: 0, name: every_frame, desc: "Forward every frame"}
      - {value: 1, name: periodic,    desc: "arg = minimum interval, ms"}
      - {value: 2, name: on_change,   desc: "arg = debounce interval, ms"}
      - {value: 3, name: every_nth,   desc: "arg = N"}
  phy:
    width: 1
    # Values match the Bluetooth LE PHY numbering. There is deliberately no
    # zero member: "the device cannot determine its PHY" is a cleared validity
    # bit, never a reserved value of the field (SPEC.md 1.1).
    members:
      - {value: 1, name: le_1m,    desc: "LE 1M"}
      - {value: 2, name: le_2m,    desc: "LE 2M"}
      - {value: 3, name: le_coded, desc: "LE Coded"}

bitmasks:
  gps_validity:
    width: 4
    bits:
      - {bit: 0,  name: t_utc,          desc: "t_utc carries a GNSS time solution"}
      - {bit: 1,  name: t_utc_resolved, desc: "Leap seconds fully resolved"}
      - {bit: 2,  name: position,       desc: "lat and lon are valid"}
      - {bit: 3,  name: alt_msl}
      - {bit: 4,  name: alt_ellipsoid}
      - {bit: 5,  name: velocity,       desc: "vel_n, vel_e and vel_d are all valid"}
      - {bit: 6,  name: head_mot}
      - {bit: 7,  name: h_acc}
      - {bit: 8,  name: v_acc}
      - {bit: 9,  name: s_acc}
      - {bit: 10, name: p_dop}
      - {bit: 11, name: num_sv}
    reserved_from: 12
  fix_flags:
    width: 1
    bits:
      - {bit: 0, name: differential, desc: "Differential corrections applied"}
      - {bit: 1, name: rtk_float}
      - {bit: 2, name: rtk_fixed}
      - {bit: 3, name: clock_disciplined, desc: "t_device was GNSS-disciplined at this sample"}
    reserved_from: 4
  capabilities:
    width: 4
    bits:
      - {bit: 0, name: gps}
      - {bit: 1, name: can}
      - {bit: 2, name: imu}
      - {bit: 3, name: monitor}
      - {bit: 4, name: control}
      - {bit: 5, name: can_fd}
      - {bit: 6, name: masked_subscriptions}
      - {bit: 7, name: on_change_subscriptions}
    reserved_from: 8
  link_validity:
    width: 2
    bits:
      - {bit: 0, name: att_mtu,        desc: "att_mtu carries the negotiated value"}
      - {bit: 1, name: ll_data_length, desc: "ll_max_tx_octets and ll_max_rx_octets are valid"}
      - {bit: 2, name: conn_params,    desc: "conn_interval, peripheral_latency and supervision_timeout are all valid"}
      - {bit: 3, name: phy,            desc: "phy_tx and phy_rx are valid"}
    reserved_from: 4

records:

  info:
    characteristic: info
    size: 24
    access: read
    desc: "Device self-description. Read once per connection; never cached across connections."
    fields:
      - {name: protocol_major, offset: 0,  size: 1, type: u8,  desc: "MUST equal 1; cross-check against the discovered service UUID"}
      - {name: protocol_minor, offset: 1,  size: 1, type: u8}
      - {name: capabilities,   offset: 2,  size: 4, type: u32, bitmask: capabilities}
      - {name: gps_rate_hz,    offset: 6,  size: 2, type: u16, units: Hz, desc: "Current rate; 0 if no GPS"}
      - {name: gps_max_rate_hz, offset: 8, size: 2, type: u16, units: Hz}
      - {name: can_subscription_slots, offset: 10, size: 2, type: u16}
      - {name: can_max_frames_per_s,   offset: 12, size: 4, type: u32, units: "frames/s"}
      - {name: imu_rate_hz,     offset: 16, size: 2, type: u16, units: Hz}
      - {name: imu_max_rate_hz, offset: 18, size: 2, type: u16, units: Hz}
      - {name: can_max_payload, offset: 20, size: 1, type: u8, desc: "8 for classic CAN, 64 for CAN FD"}
      - {name: clock_flags,     offset: 21, size: 1, type: u8, desc: "bit0 GNSS-disciplined, bit1 clock survives reconnect"}
      - {name: max_notify_bytes, offset: 22, size: 2, type: u16, units: bytes}

  gps_fix:
    characteristic: gps
    size: 74
    access: notify
    extensible: true
    validity: gps_validity
    desc: "One complete position solution. Never split, never paired, never packed."
    fields:
      - {name: seq,      offset: 0,  size: 2, type: u16, desc: "Increments per fix produced, including dropped ones. Wraps."}
      - {name: dropped,  offset: 2,  size: 2, type: u16, desc: "Fixes discarded since the previous notification"}
      - {name: validity, offset: 4,  size: 4, type: u32, bitmask: gps_validity}
      - {name: t_device, offset: 8,  size: 8, type: u64, units: us,  desc: "Monotonic device clock"}
      - {name: t_utc,    offset: 16, size: 8, type: i64, units: ms,  desc: "Unix epoch", valid_bit: t_utc}
      - {name: lat,      offset: 24, size: 4, type: i32, units: deg, scale: 1.0e-7, valid_bit: position}
      - {name: lon,      offset: 28, size: 4, type: i32, units: deg, scale: 1.0e-7, valid_bit: position}
      - {name: alt_msl,       offset: 32, size: 4, type: i32, units: mm, valid_bit: alt_msl}
      - {name: alt_ellipsoid, offset: 36, size: 4, type: i32, units: mm, valid_bit: alt_ellipsoid}
      - {name: vel_n,    offset: 40, size: 4, type: i32, units: mm/s, valid_bit: velocity}
      - {name: vel_e,    offset: 44, size: 4, type: i32, units: mm/s, valid_bit: velocity}
      - {name: vel_d,    offset: 48, size: 4, type: i32, units: mm/s, valid_bit: velocity}
      - {name: head_mot, offset: 52, size: 4, type: i32, units: deg, scale: 1.0e-5, valid_bit: head_mot}
      - {name: h_acc,    offset: 56, size: 4, type: u32, units: mm,   desc: "1 sigma", valid_bit: h_acc}
      - {name: v_acc,    offset: 60, size: 4, type: u32, units: mm,   desc: "1 sigma", valid_bit: v_acc}
      - {name: s_acc,    offset: 64, size: 4, type: u32, units: mm/s, desc: "1 sigma", valid_bit: s_acc}
      - {name: p_dop,    offset: 68, size: 2, type: u16, scale: 0.01, valid_bit: p_dop}
      - {name: fix_type, offset: 70, size: 1, type: u8, enum: fix_type}
      - {name: num_sv,   offset: 71, size: 1, type: u8, valid_bit: num_sv}
      - {name: fix_flags, offset: 72, size: 1, type: u8, bitmask: fix_flags}
      - {name: ext_count, offset: 73, size: 1, type: u8, desc: "Extension records following the base record"}

  can_header:
    characteristic: can
    size: 16
    access: notify
    desc: "Batch header. Followed by `count` can_record entries."
    fields:
      - {name: seq,     offset: 0,  size: 2, type: u16}
      - {name: dropped, offset: 2,  size: 2, type: u16, desc: "Frames the device discarded since the previous notification"}
      - {name: t_base,  offset: 4,  size: 8, type: u64, units: us, desc: "Bus-arrival time of record 0"}
      - {name: count,   offset: 12, size: 1, type: u8}
      - {name: flags,   offset: 13, size: 1, type: u8, desc: "bit0 device is shedding load"}
      - {name: reserved, offset: 14, size: 2, type: u16, reserved: true}

  can_record:
    size: 7          # plus `len` payload bytes
    variable: payload
    desc: "One CAN frame with a device-measured bus-arrival time."
    fields:
      - {name: dt,  offset: 0, size: 2, type: u16, units: "10us", desc: "Ticks since t_base; window is 0..655.35 ms"}
      - {name: id,  offset: 2, size: 4, type: u32, desc: "bits 0-28 arbitration id; b29 extended; b30 CAN FD; b31 RTR"}
      - {name: len, offset: 6, size: 1, type: u8,  desc: "Payload length, 0..64"}

  imu_header:
    characteristic: imu
    size: 20
    access: notify
    desc: "Batch header. Followed by `count` evenly spaced imu_sample entries."
    fields:
      - {name: seq,     offset: 0,  size: 2, type: u16}
      - {name: dropped, offset: 2,  size: 2, type: u16, desc: "Samples discarded since the previous notification"}
      - {name: t_base,  offset: 4,  size: 8, type: u64, units: us, desc: "Timestamp of sample 0"}
      # u32 rather than u16: a u16 microsecond period cannot express any rate
      # below 15.26 Hz, so a 10 Hz IMU was unrepresentable. Microseconds rather
      # than a finer unit so this shares the device clock's units with GPS and
      # CAN -- cross-channel alignment is the point, and a second scale would
      # be a division at every comparison.
      - {name: period,  offset: 12, size: 4, type: u32, units: us, desc: "Interval between samples"}
      - {name: count,   offset: 16, size: 1, type: u8}
      - {name: flags,   offset: 17, size: 1, type: u8, desc: "bit0 accel present, bit1 gyro present"}
      - {name: reserved, offset: 18, size: 2, type: u16, reserved: true}

  imu_sample:
    size: 12
    desc: "Sensor-frame acceleration and rotation. Vehicle alignment is the client's job."
    # A sample carries no mask of its own: presence is declared once per batch
    # in imu_header.flags. Stating that here rather than in prose is what lets
    # the encoder gating, the decoder's absent set and the corpus completeness
    # check all derive it, instead of each reimplementing SPEC.md 7 by hand.
    presence: {record: imu_header, field: flags, bits: {accel: 0, gyro: 1}}
    fields:
      - {name: ax, offset: 0,  size: 2, type: i16, units: mg,     desc: "milli-g", presence_bit: accel}
      - {name: ay, offset: 2,  size: 2, type: i16, units: mg, presence_bit: accel}
      - {name: az, offset: 4,  size: 2, type: i16, units: mg, presence_bit: accel}
      - {name: gx, offset: 6,  size: 2, type: i16, units: deg/s, scale: 0.05, presence_bit: gyro}
      - {name: gy, offset: 8,  size: 2, type: i16, units: deg/s, scale: 0.05, presence_bit: gyro}
      - {name: gz, offset: 10, size: 2, type: i16, units: deg/s, scale: 0.05, presence_bit: gyro}

  link_params:
    access: control
    size: 16
    validity: link_validity
    desc: "The device's view of the negotiated link. Reported, never negotiated here."
    fields:
      - {name: validity,            offset: 0,  size: 2, type: u16, bitmask: link_validity}
      - {name: att_mtu,             offset: 2,  size: 2, type: u16, units: bytes,  valid_bit: att_mtu}
      - {name: ll_max_tx_octets,    offset: 4,  size: 2, type: u16, units: octets, valid_bit: ll_data_length}
      - {name: ll_max_rx_octets,    offset: 6,  size: 2, type: u16, units: octets, valid_bit: ll_data_length}
      - {name: conn_interval,       offset: 8,  size: 2, type: u16, units: "1.25ms", valid_bit: conn_params}
      - {name: peripheral_latency,  offset: 10, size: 2, type: u16, desc: "Connection events the device may skip", valid_bit: conn_params}
      - {name: supervision_timeout, offset: 12, size: 2, type: u16, units: "10ms", valid_bit: conn_params}
      - {name: phy_tx,              offset: 14, size: 1, type: u8, enum: phy, valid_bit: phy}
      - {name: phy_rx,              offset: 15, size: 1, type: u8, enum: phy, valid_bit: phy}

control:
  request:  "[opcode:u8][tag:u8][params...]"
  response: "[opcode:u8][tag:u8][status:u8][detail...]"
  opcodes:
    - {value: 0x01, name: CAN_RESET,          params: "",                                   desc: "Clear all subscriptions and stop the CAN stream"}
    - {value: 0x02, name: CAN_SUBSCRIBE,      params: "id:u32, mode:u8, arg:u16"}
    - {value: 0x03, name: CAN_SUBSCRIBE_MASK, params: "id:u32, mask:u32, mode:u8, arg:u16"}
    - {value: 0x04, name: CAN_UNSUBSCRIBE,    params: "id:u32"}
    - {value: 0x05, name: CAN_LIST,           params: "",                                   desc: "Response carries the installed subscription table"}
    - {value: 0x10, name: GPS_SET_RATE,       params: "hz:u16"}
    - {value: 0x20, name: IMU_SET_RATE,       params: "hz:u16"}
    - {value: 0x30, name: TIME_SYNC,          params: "host_t_utc_ms:i64",                  desc: "Response echoes the device t_device at receipt"}
    - {value: 0x31, name: GET_LINK_PARAMS,    params: "",                                   desc: "Response detail is one link_params record"}
    - {value: 0x40, name: LIST_CHANNELS,      params: "",                                   desc: "Monitor role: channels the client can provide"}
