name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The schema is the source of truth. If any generated artefact has
      # drifted from it, the spec tables, the vectors and the reference header
      # can disagree — which is the failure this repository exists to prevent.
      - name: Generated artefacts are up to date
        run: python3 tools/generate.py --check

      # The drift check above covers GENERATED artefacts. This covers the
      # hand-written prose that describes them: section cross-references that
      # resolve, and stated corpus counts that match the corpus. Both drift
      # silently and neither is visible to the conformance suite.
      - name: Documentation claims match the artefacts
        run: python3 tools/check_docs.py

      # Asks from the SCHEMA what a vector would have to look like to exercise
      # each rule, and fails if the corpus has none. Complements the mutation
      # sweep below rather than duplicating it: this catches rules no vector
      # exercises, that one catches code no rule reaches.
      - name: Corpus can detect a violation of every rule
        run: python3 tools/check_corpus.py

      - name: Build C reference decoder
        run: make -C reference/c

      - name: Conformance — C reference
        run: python3 conformance/run.py --impl "reference/c/vtp1_cli"

      - name: Conformance — Python reference
        run: python3 conformance/run.py --impl "python3 reference/python/vtp1.py"

      # A suite that cannot fail proves nothing. Break the decoder on purpose
      # and require the corpus to notice.
      - name: Conformance suite detects a seeded fault
        run: |
          cp reference/c/vtp1.c /tmp/vtp1.c.orig
          sed -i 's|(uint64_t)o->dt \* 10u|(uint64_t)o->dt * 1u|' reference/c/vtp1.c
          make -C reference/c
          if python3 conformance/run.py --impl "reference/c/vtp1_cli"; then
            echo "::error::Seeded CAN timestamp fault was not detected by the corpus"
            exit 1
          fi
          cp /tmp/vtp1.c.orig reference/c/vtp1.c
          make -C reference/c
          echo "Seeded decoder fault correctly detected."

      # The encoder's gating rule (SPEC.md 5.1) is covered by exactly one
      # non-canonical vector. Removing that vector, or the gate, must fail.
      - name: Conformance suite detects a seeded encoder fault
        run: |
          cp reference/c/vtp1_encode.c /tmp/vtp1_encode.c.orig
          perl -pi -e 's/gate32\(\(uint32_t\)f->alt_msl, v, VTP_GPS_VALIDITY_ALT_MSL\)/(uint32_t)f->alt_msl/' reference/c/vtp1_encode.c
          make -C reference/c
          if python3 conformance/run.py --impl "reference/c/vtp1_cli"; then
            echo "::error::Seeded encoder gating fault was not detected by the corpus"
            exit 1
          fi
          cp /tmp/vtp1_encode.c.orig reference/c/vtp1_encode.c
          make -C reference/c
          echo "Seeded encoder fault correctly detected."

      # The synthetic device decoded by the reference decoder. Needs no
      # Bluetooth adapter, because everything worth testing in a peripheral is
      # in the device model rather than the transport -- and it asserts what no
      # single-payload vector can: one shared clock across three roles,
      # timestamps that advance across batches, and a control plane that
      # changes behaviour rather than merely answering.
      - name: Software peripheral conforms
        run: python3 reference/peripheral/selftest.py

      # The two steps above are handcrafted regression guards for specific
      # bugs. This sweeps whole CLASSES of fault -- every encoder validity
      # gate, every decoder field offset, every exact-length check -- and
      # fails on any mutation the corpus does not notice. A survivor is a hole
      # in the corpus, not a bug in the decoder. It found eight on its first
      # run, none of which review had caught.
      - name: Conformance suite has no coverage holes
        run: python3 tools/mutate.py

      # ...and the sweep itself must be capable of failing. Breaking a header
      # made all 79 mutations fail to compile while tools/mutate.py reported
      # success and exited 0, so this step passed green over a check that had
      # silently become a no-op. Guard the guard.
      - name: Mutation sweep fails when it proves nothing
        run: |
          cp reference/c/vtp1.h /tmp/vtp1.h.orig
          printf '\n#error deliberately broken\n' >> reference/c/vtp1.h
          if python3 tools/mutate.py --operator offset; then
            echo "::error::mutate.py reported success with a build that cannot compile"
            cp /tmp/vtp1.h.orig reference/c/vtp1.h
            exit 1
          fi
          cp /tmp/vtp1.h.orig reference/c/vtp1.h
          make -C reference/c
          echo "Mutation sweep correctly refuses to pass on a broken build."

      # SPEC.md 12 promises an existing vector never changes meaning within a
      # major version. The corpus is generated, so a schema edit can quietly
      # change what one expects and every other check here would still pass --
      # generator, decoders and runner would simply agree about the new answer.
      # The corpus is compared against itself; this compares it against what it
      # used to say.
      - name: No existing vector changed meaning
        run: python3 tools/check_baseline.py --check

      # The device model is one half; this is the other. Every bug it covers
      # -- sequence numbers burned by unsubscribed notifications, a number
      # returned after a later notification took it, a connection edge handled
      # after the tick had already sent -- reached a real phone before anyone
      # noticed, because none is reachable by a conformance vector and none is
      # in the device model. It drives the REAL pump against a fake GATT link.
      - name: Transport state machine conforms
        run: python3 reference/peripheral/transport_selftest.py

      # The other direction. run.py only ever round-trips payloads that
      # already decoded, so it asks whether an encoder reproduces something
      # valid and never whether it declines something invalid. That gap let an
      # encoder mask an out-of-range identifier into a valid frame for a
      # different one, which no decoder could flag.
      - name: Encoders refuse what they must
        run: python3 tools/check_encoders.py

      # A partial implementation runs the roles it declares (SPEC.md 12). If
      # this stops filtering, a GPS-only decoder is handed CAN vectors and
      # fails conformance for records it never claimed.
      - name: Roles can be declared
        run: |
          python3 conformance/run.py --impl "reference/c/vtp1_cli" --roles gps
          python3 conformance/run.py --impl "reference/c/vtp1_cli" --roles can,monitor
          if python3 conformance/run.py --impl "reference/c/vtp1_cli" --roles nonsense; then
            echo "::error::an unknown role name was accepted"
            exit 1
          fi
